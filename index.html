<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>籃球練等王 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen open-world canvas; dark translucent HUD top, action pad bottom-right, drag-anywhere joystick, modal panels for menu/NPC. Single committed look. */
:root{
  --grass:#3d6b3a; --ink:#fff7ec; --ball:#ff7a1a; --gold:#ffd34d;
  --hp:#ff4560; --xp:#43e0c6; --panel:#16100bdd; --panel2:#ffffff12; --muted:#c7b39b;
  --disp:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--grass);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--xp);outline-offset:2px}

#hud{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:6px;z-index:2}
.top{display:flex;gap:8px;align-items:stretch;background:var(--panel);border-radius:14px;padding:8px;border:1px solid #ffffff1f}
.lvb{flex:none;width:52px;border-radius:10px;background:var(--ball);color:#2a1206;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvb small{font-family:var(--disp);font-size:10px}
.lvb b{font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
#online{pointer-events:auto;cursor:pointer;text-decoration:underline dotted}
.zone{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:14px;border-radius:7px;background:#0008;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0}
.bar.hp i{background:linear-gradient(#ff6b80,var(--hp))}
.bar.xp{height:10px}.bar.xp i{background:var(--xp)}
.bar span{position:relative;display:block;text-align:center;font-family:var(--disp);font-size:10px;line-height:14px;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.bar.xp span{line-height:10px;font-size:8px}
.rt{flex:none;display:flex;flex-direction:column;gap:5px;align-items:flex-end;justify-content:center}
.coins{font-family:var(--disp);font-size:14px;color:var(--gold);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.coins i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8860b}
#menuBtn{pointer-events:auto;position:relative;background:#ffffff1c;border:1px solid #ffffff33;border-radius:8px;padding:4px 12px;font-weight:900;font-size:13px}
#menuBtn em{position:absolute;top:-6px;right:-6px;background:var(--hp);color:#fff;border-radius:9px;min-width:18px;height:18px;font-style:normal;font-family:var(--disp);font-size:10px;display:grid;place-items:center;padding:0 3px}
.quest{align-self:flex-start;background:var(--panel);border-left:4px solid var(--gold);border-radius:8px;padding:6px 10px;font-size:12px;max-width:62%}
.quest b{color:var(--gold);display:block;font-size:11px}
.quest span{font-variant-numeric:tabular-nums}
.guide{pointer-events:auto;align-self:flex-start;text-align:left;background:var(--panel);border:0;border-left:4px solid var(--xp);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.55;max-width:62%;color:var(--ink)}
.guide b{color:var(--xp);display:block;font-size:11px}
.guide u{color:var(--gold);text-decoration:none;font-weight:900}
.it.rec{outline:2px solid var(--xp)}
.it .tag{font-family:var(--disp);font-size:11px;color:#2a1206;background:var(--xp);border-radius:6px;padding:2px 6px;flex:none}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:12px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.legend i{font-style:normal;font-weight:900}

#ctrl{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:220px;height:220px;z-index:2;pointer-events:none}
#ctrl button{position:absolute;pointer-events:auto;border:0;border-radius:50%;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 4px 0 #0007}
#atk{right:8px;bottom:8px;width:86px;height:86px;background:var(--ball);color:#2a1206;font-family:var(--disp);font-size:16px}
#atk .nx{font-family:var(--body);font-weight:900;font-size:11px;opacity:.75}
#atk:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.sk{width:60px;height:60px;background:#1b130dcc;border:2px solid var(--pc,#ff7a1a)!important;font-weight:900;font-size:12px;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000b calc(var(--cd,0)*360deg),transparent 0)}
.sk small{font-family:var(--disp);font-size:9px;color:var(--pc,#ff7a1a)}
.sk.lock>span{opacity:.5}
.sk.lock small{color:var(--gold)}
.sk .mp{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(var(--gold) calc(var(--mp,0)*360deg),#ffffff1c 0);-webkit-mask:radial-gradient(circle,transparent 24px,#000 25px);mask:radial-gradient(circle,transparent 24px,#000 25px)}
.sk span,.sk small{position:relative}
#sk0{right:110px;bottom:12px}#sk1{right:100px;bottom:92px}#sk2{right:22px;bottom:118px}#sk3{right:176px;bottom:58px;background:#2a2008cc}
#ctrl{width:250px}
.guide b.main{color:var(--gold)}
.pf{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffffff22,#ffffff08);flex:none}
.dot.nar{background:#ffffff22;box-shadow:none}
.npc h2{margin:0}
.line{font-size:16px!important;color:var(--ink)!important;min-height:3.2em}
.line.nar{color:var(--muted)!important;font-style:italic}
.learn{text-align:center;border:2px solid var(--lc);border-radius:14px;padding:16px;margin-bottom:14px;background:radial-gradient(circle at 50% 0%,#ffffff1a,transparent 70%);display:flex;flex-direction:column;gap:6px}
.learn small{font-size:12px;color:var(--muted);letter-spacing:.1em}
.learn b{font-family:var(--disp);font-size:28px;color:var(--lc)}
.learn span{font-weight:900}
.learn em{font-style:normal;font-size:12px;color:var(--muted)}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 240px);z-index:2;background:var(--gold);color:#2a1206;border:0;border-radius:22px;padding:10px 26px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #8a6a10}

#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font:700 11px/1.3 "Noto Sans TC",sans-serif;white-space:nowrap;text-align:center;text-shadow:0 1px 2px #000,0 0 3px #000;will-change:transform}
.lbl b{color:#ffd34d}.lbl em{display:block;font:900 22px Bungee,sans-serif;color:#ffd34d;font-style:normal}
.lbl i{display:block;width:64px;height:5px;margin:2px auto 0;background:#000a;border-radius:3px;overflow:hidden}.lbl u{display:block;height:100%;background:#ff4560}
.ftx{position:absolute;left:0;top:0;font:14px Bungee,sans-serif;text-shadow:0 2px 0 #000,0 0 4px #000;white-space:nowrap;will-change:transform}
.ftx.big{font-size:22px}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:1;background:radial-gradient(circle,rgba(255,40,60,0) 45%,rgba(255,40,60,.75) 100%)}
#combo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:42%;z-index:2;pointer-events:none;font:900 14px "Noto Sans TC",sans-serif;text-shadow:0 2px 0 #000}
#combo b{font:36px Bungee,sans-serif;margin-right:4px}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:3px solid #ffffff66;border-radius:50%;pointer-events:none;z-index:2}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ffffff77}
#mini{position:fixed;left:auto;bottom:auto;right:max(12px,env(safe-area-inset-right,0px));width:132px;height:92px;border-radius:8px;z-index:2;pointer-events:none}
#jumpB{right:180px;bottom:138px;width:54px;height:54px;background:#43e0c6;color:#08302a;font-weight:900;font-size:16px}
#emoB{right:236px;bottom:150px;width:44px;height:44px;background:#1b130dcc;border:2px solid #ffffff55!important;font-weight:900;font-size:14px}
#emoP{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 250px);z-index:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
#emoP button{background:var(--panel);border:1px solid #ffffff44;border-radius:18px;padding:8px 14px;font-weight:900;font-size:14px}
.lbl .emo{display:inline-block;background:#fff;color:#1a1008;border-radius:10px;padding:2px 8px;margin-bottom:3px;text-shadow:none;font-size:12px}
#meter{position:fixed;left:0;top:0;width:130px;height:14px;border-radius:7px;background:#000b;border:2px solid #fff;z-index:2;pointer-events:none;overflow:hidden}
#meter b{position:absolute;left:68%;width:22%;top:0;bottom:0;background:#43e0c6}
#meter i{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#ffd34d;box-shadow:0 0 6px #ffd34d}
#tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 300px);width:min(92vw,420px);z-index:3;background:#16100bf0;border:2px solid var(--gold);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
#tut b{color:var(--gold);font-size:12px}
#tut span{font-size:14px;line-height:1.55;font-weight:700}
#tut button{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}
.tutHL{outline:3px solid var(--gold)!important;outline-offset:3px;animation:tutp 1s ease-in-out infinite}
@keyframes tutp{50%{outline-color:#fff;transform:scale(1.08)}}
#jumpB:active{transform:translateY(2px)}
#banner{position:fixed;left:0;right:0;top:27%;z-index:4;pointer-events:none;text-align:center;padding:12px 16px;background:linear-gradient(90deg,transparent,#000000cc 18%,#000000cc 82%,transparent);display:flex;flex-direction:column;gap:4px}
#banner b{font:900 24px/1.2 "Noto Sans TC",sans-serif;color:var(--gold);text-shadow:0 2px 0 #000}
#banner span{font-size:13px;color:#fff}
#banner.show{animation:bin .35s ease-out}
@keyframes bin{from{transform:scale(1.4);opacity:0}}
.evtbar.mode{background:#1d1430e6;border-left-color:#b98cff;color:#fff;line-height:1.5}.evtbar.mode b{color:var(--gold);font-family:var(--disp);font-size:15px}
#exitB{pointer-events:auto;align-self:flex-start;background:#ff4560;color:#fff;border:0;border-radius:8px;padding:5px 14px;font-weight:900;font-size:13px}
.rk{font-family:var(--disp);width:30px;text-align:center;color:var(--gold);flex:none;font-size:15px}
.rtabs button{flex:1 0 20%;font-size:12px}
#nick{width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid #ffffff33;background:#0006;color:var(--ink);font:inherit;font-size:16px}
.lbl .ttl{display:block;color:#ffd34d;font-size:11px}
.achbar{height:6px;background:#0008;border-radius:3px;overflow:hidden;margin-top:4px}.achbar i{display:block;height:100%;background:var(--xp)}
.evtbar{align-self:flex-start;background:#3a0d18e6;border-left:4px solid var(--hp);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:900;color:#ffd2da}
#toast{position:fixed;left:0;right:0;top:36%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#toast div{background:var(--panel);border:1px solid #ffffff2a;border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;text-align:center;animation:tin .25s ease-out}
#toast div.gold{border-color:var(--gold);color:var(--gold)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}

.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:#1c140e;border:2px solid var(--ball);border-radius:18px;padding:18px;max-width:400px;width:100%;max-height:100%;overflow:auto;box-shadow:0 8px 0 #0008}
.card h1{font-family:var(--disp);font-size:clamp(30px,10vw,44px);line-height:1;margin:0 0 8px;color:var(--ball);text-shadow:3px 3px 0 #000;text-align:center;text-wrap:balance}
.card h2{font-size:18px;margin:0 0 4px}
.card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 14px}
.btn{font-family:var(--disp);font-size:16px;background:var(--ball);color:#2a1206;border:0;border-radius:12px;padding:12px 22px;box-shadow:0 4px 0 #a3420a;width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a3420a}
.btn:disabled{background:#5a4a3c;color:#9a8a7a;box-shadow:none}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:none;border:1px solid #ffffff2a;font-family:var(--body);font-weight:900}
.btn.sm{width:auto;padding:7px 12px;font-size:13px}
.news{background:#ffffff0d;border-left:4px solid var(--xp);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:12px;line-height:1.6;color:var(--muted)}
.news b{color:var(--xp);display:block}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs{flex-wrap:wrap}
.tabs button{flex:1 0 30%;background:var(--panel2);border:1px solid #ffffff22;border-radius:10px;padding:8px 4px;font-weight:900;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--ball);color:#2a1206;border-color:var(--ball)}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.it .tx{flex:1;min-width:0}
.it b{display:block;font-size:15px}
.it em{font-style:normal;font-size:12px;color:var(--muted);display:block;line-height:1.5}
.it .num{font-family:var(--disp);font-size:20px;color:var(--gold);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.dot{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:inset -4px -4px 0 #0005}
.pts{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}
.pts b{font-family:var(--disp);color:var(--gold);font-size:20px}
.btns{display:flex;gap:6px;flex:none}
.sklist{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
.sklist s{text-decoration:none;opacity:.55}
.row2{display:flex;gap:8px;margin-top:12px}
.close{margin-top:14px}
.npc{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.npc .dot{width:48px;height:48px}
</style>

<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hurt"></div>
<div id="combo" hidden></div>
<div id="joy" hidden><i></i></div>
<canvas id="mini" hidden></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="lvb"><small>LV</small><b id="lv">1</b></div>
    <div class="bars">
      <div class="zone"><span id="zone">新手公園</span>　<small id="daynight" style="color:var(--muted)">白天</small>　<small id="online" style="color:var(--xp)"></small></div>
      <div class="bar hp"><i id="hpi"></i><span id="hpt">100/100</span></div>
      <div class="bar xp"><i id="xpi"></i><span id="xpt">0/43</span></div>
    </div>
    <div class="rt">
      <div class="coins"><i></i><b id="coins">0</b></div>
      <button id="menuBtn">選單<em id="ptsb" hidden>0</em></button>
    </div>
  </div>
  <div class="quest" id="quest" hidden></div>
  <div class="evtbar" id="evtbar" hidden></div>
  <div class="evtbar mode" id="modebar" hidden></div>
  <button id="exitB" hidden>離開</button>
  <button class="guide" id="guide"></button>
</div>

<div id="ctrl" hidden>
  <button class="sk" id="sk0"></button>
  <button class="sk" id="sk1"></button>
  <button class="sk" id="sk2"></button>
  <button class="sk" id="sk3"></button>
  <button id="jumpB">跳</button>
  <button id="emoB" hidden>聊</button>
  <button id="atk">投籃<small class="nx">快傳</small></button>
</div>
<button id="talk" hidden>對話</button>
<div id="emoP" hidden><button data-emo="0">嗨！</button><button data-emo="1">好球！</button><button data-emo="2">來單挑！</button><button data-emo="3">GG</button></div>
<div id="meter" hidden><b></b><i></i></div>
<div id="tut" hidden><b id="tutN"></b><span id="tutT"></span><button id="tutX">跳過導覽</button></div>
<div id="who" class="modal" hidden style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,400px);max-height:75vh;overflow:auto;z-index:6;background:#16100bf2;border:2px solid var(--gold);border-radius:14px;padding:14px"></div>
<div id="toast"></div>
<div id="banner" hidden></div>

<div class="modal" id="start">
  <div class="card">
    <h1>籃球<br>練等王</h1>
    <p>從新手公園出發，找教練接任務、打倒對手升級。每升一級拿 3 點屬性，存錢買「球能力」解鎖新招式，一路練到天空球場挑戰籃球之神。</p>
    <div class="news" id="news"></div>
    <div class="news" id="plc" hidden></div>
    <button class="btn" id="go">開始練等</button>
    <div class="hint">手機：左半邊拖曳移動、右半邊拖曳轉視角，右下按鈕投籃、跳、放技能<br>電腦：WASD 移動・滑鼠拖曳轉視角・滾輪拉近拉遠・J 投籃・空白鍵跳（跳起來可以躲球）・1–4 技能・E 對話・M 選單<br>進度會自動存在這台裝置上</div>
  </div>
</div>

<div class="modal" id="menu" hidden>
  <div class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-stat" aria-selected="true">屬性</button>
      <button role="tab" id="t-pow" aria-selected="false">球能力</button>
      <button role="tab" id="t-gear" aria-selected="false">裝備</button>
      <button role="tab" id="t-ach" aria-selected="false">成就</button>
      <button role="tab" id="t-rank" aria-selected="false">排行</button>
      <button role="tab" id="t-tp" aria-selected="false">傳送</button>
      <button role="tab" id="t-guide" aria-selected="false">指南</button>
      <button role="tab" id="t-daily" aria-selected="false">每日</button>
      <button role="tab" id="t-pet" aria-selected="false">寵物</button>
    </div>
    <div id="panel"></div>
    <button class="btn alt close" id="closeMenu">回到球場</button>
  </div>
</div>

<div class="modal" id="dialog" hidden>
  <div class="card" id="dlgc"></div>
</div>

<div class="modal" id="idle" hidden>
  <div class="card"><h2>掛機收穫</h2><p id="idleT"></p><div class="list" id="idleL"></div><button class="btn close" id="idleGo">全部領取</button></div>
</div>

<div class="modal" id="dead" hidden>

function dribble(st0,x,y,face,moving,low,dt){st0.ph=(st0.ph||0)+dt*(moving?9.5:6.5);const s=Math.sin(st0.ph),h=Math.abs(s),beat=Math.floor(st0.ph/Math.PI);

  const sd=st0.side,fx=Math.cos(face),fy=Math.sin(face),rx=Math.cos(face+Math.PI/2),ry=Math.sin(face+Math.PI/2),fwd=moving?.55:.35;
  return{x:x*U+fx*fwd+rx*sd*.42,y:.3+h*(low?.55:.95),z:y*U+fy*fwd+ry*sd*.42,side:sd,h}}

    <p>下一位對手：<b>${rv.n}</b>・你的戰績 ${st('duelWins')} 勝</p><div class="list"><button class="btn" id="sgo">跟電腦鬥牛</button></div>
    <h2 style="margin-top:16px">跟網友連線</h2>${MP.room?`<p>開房會拿到 4 位數房號，朋友在這裡輸入同一個房號就能跟你單挑（限時 120 秒）。連線戰績 ${st('pvpWins')} 勝</p>
    <div class="list"><button class="btn alt" id="pvpH">開房間</button><div class="it"><div class="tx"><input id="pvpC" inputmode="numeric" maxlength="4" placeholder="輸入房號" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ffffff33;background:#0006;color:var(--ink);font-size:16px"></div><button class="btn sm" id="pvpJ">加入</button></div></div>`:`<p>這個裝置目前無法連線。連線需要登入 Claude，而且要由遊戲擁有者邀請；用公開連結開啟的人只能跟電腦鬥牛。</p>`}`}
  else{const di=dunInfo();h+=`<p>地下城裡的敵人一波比一波強，每 5 波會出現魔王。死掉或離開就結束，撐越多波獎勵越好，3 波以上必得裝備。</p>
    <p>今天還能進去 <b>${3-di.runs}</b> 次・最佳紀錄 <b>${st('dunBest')}</b> 波</p><div class="list"><button class="btn" id="sgo" ${di.runs>=3?'disabled':''}>進入地下城</button></div>`}
  h+=`<button class="btn alt close" id="dc">離開</button>`;$('dlgc').innerHTML=h;$('dialog').hidden=false;
  $('sgo').onclick=()=>sp.k==='duel'?startDuel():startDun();$('dc').onclick=closeAll;
  {const hb=$('pvpH'),jb=$('pvpJ');if(hb)hb.onclick=()=>pvpOpen(true,String(ri(1000,9999)));if(jb)jb.onclick=()=>pvpOpen(false,$('pvpC').value)}}
function openNpc(){
  {const sp=specNear();if(sp){openSpecial(sp);return}}
  const zi=npcNear();if(zi<0)return;paused=true;atkHeld=false;joy.on=false;
  const z=ZONES[zi],q=SV.quest;const avg=(z.mob.l[0]+z.mob.l[1])/2;
  const mobXp=Math.round(6+avg*avg*.55),mobCoin=Math.round(4+avg*2.5);
  const nq={zi,boss:false,need:8,have:0,xp:mobXp*8*3,coin:mobCoin*8*2};
  const bq={zi,boss:true,need:1,have:0,xp:Math.round(6+z.boss.lv**2*.55)*12*2,coin:Math.round(4+z.boss.lv*2.5)*15*2};
  let h=`<div class="npc"><span class="dot" style="background:${z.npcCol}"></span><div><h2>${z.npc}</h2><p style="margin:0">${z.name}</p></div></div>`;
  if(q){const qz=ZONES[q.zi];h+=`<p>你正在進行：擊倒 ${q.boss?qz.boss.n:qz.mob.n}（${q.have}/${q.need}）。要放棄嗎？</p><div class="list"><button class="btn alt" id="dq">放棄目前任務</button></div>`}
  else{
    const rz=recZone(SV.lv),R=ZONES[rz];
    const warn=z.s>R.s?`<p>你才 Lv ${SV.lv}，這裡的對手太強了。建議先去${R.name}打${R.mob.n}，練到 Lv ${z.s} 再來。</p>`
      :z.s<R.s?`<p>你已經 Lv ${SV.lv}，這裡對你太簡單了。去${R.name}打${R.mob.n}升級比較快。</p>`:'';
    h+=`<p>想變強就得實戰。幫我處理掉這些人，獎勵少不了你的。</p>${warn}<div class="list">
      <button class="btn" id="q1">擊倒 8 個${z.mob.n}<br><small style="font-family:var(--body);font-size:12px">+${fmtN(nq.xp)} XP・+${fmtN(nq.coin)} 金幣</small></button>
      <button class="btn alt" id="q2">王者任務：擊倒 ${z.boss.n}（Lv${z.boss.lv}）<br><small style="font-size:12px;color:var(--muted)">+${fmtN(bq.xp)} XP・+${fmtN(bq.coin)} 金幣${SV.lv<bossRec(z)?`・建議 Lv${bossRec(z)}`:''}</small></button></div>`}
  h+=`<button class="btn alt close" id="dc">離開</button>`;
  $('dlgc').innerHTML=h;$('dialog').hidden=false;
  const dq=$('dq');if(dq)dq.onclick=()=>{SV.quest=null;save();renderQuest();closeAll()};
  const q1=$('q1');if(q1)q1.onclick=()=>{SV.quest=nq;save();renderQuest();closeAll();toast('接下任務！')};
  const q2=$('q2');if(q2)q2.onclick=()=>{SV.quest=bq;save();renderQuest();closeAll();toast('接下王者任務！')};
  $('dc').onclick=closeAll;
}

// ---------- loop ----------
let lbT=20,achT=2,last=performance.now(),hudT=0,saveT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running){lbT-=dt;if(lbT<=0){lbT=60;lbSubmit()}}
  if(running&&!paused)tutUpdate();
  if(running&&!paused){achT-=dt;if(achT<=0){achT=1;checkAch()}if(hitStop>0)hitStop-=dt;else update(dt);hudT-=dt;if(hudT<=0){syncHud();hudT=.08}saveT-=dt;if(saveT<=0){save();saveT=5;if(SV.intro)checkDaily()}}
  render3d(dt);
  requestAnimationFrame(loop);
}
$('go').onclick=()=>{
  $('start').hidden=true;$('hud').hidden=false;$('ctrl').hidden=false;running=true;
  requestAnimationFrame(()=>{resize()});
  refreshSkills();renderQuest();syncHud();last=performance.now();
  {const t0=Number(SV.seen)||0;if(SV.intro)setTimeout(()=>idleCheck(t0),400);else SV.seen=Date.now()}
  if(!SV.tut&&SV.intro&&(SV.lv>=4||SV.story>0))SV.tut=99;else if(!SV.tut&&SV.intro)tutStart();
  if(!SV.intro)playScene(PROLOGUE,()=>{SV.intro=1;tutStart();checkDaily();save();if(!SV.quest)toast('先去左上角找阿伯教練接任務')});
  else checkDaily();
  if(SV._refund){toast(`速度上限是 100，已退回 ${SV._refund} 點屬性點，可以重新分配`,1);delete SV._refund;save()}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();cloudSave(true)}});
addEventListener('pagehide',()=>{save();cloudSave(true)});
initWorld();
if(SV.lv>1)$('go').textContent=`繼續練等（Lv ${SV.lv}）`;
$('news').innerHTML=`<b>最新更新・${CHANGELOG[0].v}</b>${CHANGELOG[0].t}`;
requestAnimationFrame(loop);
})();
</script>

</body></html>
